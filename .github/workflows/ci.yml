name: Creative Factory checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: creative-factory-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: ubuntu-latest
    # Fresh runner browser/dependency installation can take over eight minutes.
    # Keep the browser suite itself bounded to four minutes below.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-fund
      - run: npm run format:check
      - run: npm run content:build
      - run: npm run typecheck
      - run: npm test
      - run: npm run art:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --reporter=line,json,github --global-timeout=240000
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .cache/e2e-report.json
      - name: Browser test summary
        if: always()
        run: node scripts/write-browser-summary.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
